name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Use the latest patched release rather than the go.mod minimum (1.26.0),
      # so govulncheck checks the standard library we would actually build with.
      - uses: actions/setup-go@v7
        with:
          go-version: stable

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      # Runs the linters and formatters from .golangci.yml, including gosec.
      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15

      - name: Vulnerability check
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
